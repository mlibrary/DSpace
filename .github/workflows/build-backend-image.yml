---
name: Build dspace-backend image

on:
  workflow_dispatch:  # This allows to kick-off the action manually from GitHub Actions

jobs:
  build:
    name: dspace-backend:${{ github.ref_name }}
    # Ensure this job only executed for 'mlibrary/DSpace'
    if: github.repository == 'mlibrary/DSpace'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dspace-backend image
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          pull: true
          push: true
          tags: 'ghcr.io/mlibrary/dspace/dspace-backend:${{ github.sha }}, ghcr.io/mlibrary/dspace/dspace-backend:${{ github.ref_name }}'
          file: backend.dockerfile
          build-args: |
            DEPENDENCIES_IMAGE=ghcr.io/mlibrary/dspace/dspace-dependencies:${{ github.ref_name }}

      - name: Report Java version in published backend image
        shell: bash
        env:
          BACKEND_IMAGE: ghcr.io/mlibrary/dspace/dspace-backend:${{ github.sha }}
        run: |
          docker run --rm --entrypoint java "$BACKEND_IMAGE" -version 2>&1 | tee java-version.txt
          {
            echo '### Java version in backend image'
            echo '```'
            cat java-version.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
