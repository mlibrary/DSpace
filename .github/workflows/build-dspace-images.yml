---
name: 2. Build dspace-* images

on:
  workflow_dispatch:  # This allows to kick-off the action manually from GitHub Actions
    inputs:
      dspace_version:
        description: DSpace Version
        required: true
        default: 7.6
        type: choice
        options:
          - 7.6

jobs:
  build:
    name: dspace-*:${{ github.event.inputs.dspace_version }}
    runs-on: ubuntu-latest
    # Ensure this job only executed for 'mlibrary/DSpace'
    if: github.repository == 'mlibrary/DSpace'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dspace-solr image
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          push: true
          tags: 'ghcr.io/mlibrary/DSpace/dspace-solr:${{ github.sha }}, ghcr.io/mlibrary/DSpace/dspace-solr:${{ github.event.inputs.dspace_version }}'
          file: solr.dockerfile
          build-args: |
            SOURCE_IMAGE_TAG=${{ github.event.inputs.dspace_version }}

      - name: Build and push dspace-backend image
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          push: true
          tags: 'ghcr.io/mlibrary/DSpace/dspace-backend:${{ github.sha }}, ghcr.io/mlibrary/DSpace/dspace-backend:${{ github.event.inputs.dspace_version }}'
          file: backend.dockerfile
          build-args: |
            DSPACE_VERSION=${{ github.event.inputs.dspace_version }}

